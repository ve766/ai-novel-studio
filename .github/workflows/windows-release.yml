name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag matches the app version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $appVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($tagVersion -ne $appVersion) { throw "Release tag $tagVersion does not match package version $appVersion" }
      - run: npm test
      - run: npm run dist:win
      - run: npm run verify:package
      - name: Install and launch smoke test
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "release/*-安装版.exe" | Select-Object -First 1).FullName
          $installDir = Join-Path $env:RUNNER_TEMP "ai-novel-smoke"
          Start-Process -FilePath $installer -ArgumentList @("/S", "/D=$installDir") -Wait
          $appExe = Join-Path $installDir "AI小说创作平台.exe"
          if (-not (Test-Path $appExe)) { throw "Installer did not place the app in the requested directory" }
          $process = Start-Process -FilePath $appExe -ArgumentList "--disable-gpu" -PassThru
          Start-Sleep -Seconds 10
          $process.Refresh()
          if ($process.HasExited) { throw "The installed desktop app exited during startup" }
          Stop-Process -Id $process.Id -Force
      - name: Assemble F-drive deployment bundle
        shell: pwsh
        run: |
          $installer = Get-ChildItem "release/*-安装版.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced" }
          Copy-Item $installer.FullName "F盘部署/" -Force
          $installerHash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$installerHash *$($installer.Name)" | Set-Content "F盘部署/SHA256SUMS.txt" -Encoding ascii
          Compress-Archive -Path "F盘部署/*" -DestinationPath "F盘部署包.zip" -CompressionLevel Optimal -Force
      - name: Generate release checksums
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem "release/*-安装版.exe", "release/*-便携版.exe"
          $artifacts += Get-Item "F盘部署包.zip"
          $checksums = $artifacts | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash *$($_.Name)"
          }
          $checksums | Set-Content "release/SHA256SUMS.txt" -Encoding ascii
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $installer = (Get-ChildItem "release/*-安装版.exe" | Select-Object -First 1).FullName
          $portable = (Get-ChildItem "release/*-便携版.exe" | Select-Object -First 1).FullName
          gh release create $tag $installer $portable "release/SHA256SUMS.txt" "F盘部署包.zip" `
            --title "AI 小说创作平台 $tag" `
            --notes "Windows x64 安装版、便携版与 F 盘部署包；本版本已在 Windows runner 安装并启动验证。"
